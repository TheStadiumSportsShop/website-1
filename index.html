<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Team Shirts</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #333; color: #fff; padding: 10px; text-align: center; }
        .search-bar { margin: 20px; }
        .shirt { margin: 10px; padding: 10px; border: 1px solid #ccc; display: inline-block; }
    </style>
</head>
<body>
    <header>
        <h1>Sports Team Shirts</h1>
        <input type="text" class="search-bar" placeholder="Search shirts..." />
    </header>
    <div class="shirts">
        <div class="shirt">Argentina Shirt</div>
        <div class="shirt">Brasil Shirt</div>
        <div class="shirt">Barcelona Shirt</div>
        <div class="shirt">Real Madrid Shirt</div>
    </div>
    <script>
        const searchBar = document.querySelector('.search-bar');
        searchBar.addEventListener('input', function() {
            const shirts = document.querySelectorAll('.shirt');
            shirts.forEach(shirt => {
                if (shirt.innerText.toLowerCase().includes(this.value.toLowerCase())) {
                    shirt.style.display = '';
                } else {
                    shirt.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
